<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10243a"><title>Khan Mobiles — Shop Management</title>
<style>
:root{--navy:#10243a;--blue:#1f6feb;--bg:#f3f6fa;--ink:#182433;--muted:#64748b;--line:#dce4ee;--green:#16845b;--red:#c0392b;--card:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,Segoe UI,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 13px;font-weight:650;background:#e8eef6;color:var(--navy)}button.primary{background:var(--blue);color:#fff}button.danger{background:#fff0ee;color:var(--red)}button.small{padding:6px 9px;font-size:12px}.app{min-height:100vh;display:grid;grid-template-columns:245px minmax(0,1fr)}aside{background:var(--navy);color:#fff;padding:22px 14px;display:flex;flex-direction:column;gap:20px} .brand{padding:0 10px}.brand h1{font-size:19px;margin:0}.brand p{color:#b9c8d9;margin:4px 0 0;font-size:12px}.nav{display:grid;gap:5px}.nav button{text-align:left;background:transparent;color:#d9e4f1;font-weight:550}.nav button.active,.nav button:hover{background:#243e59;color:#fff}.side-note{margin-top:auto;font-size:11px;color:#b9c8d9;padding:8px 10px}main{min-width:0;padding:24px;max-width:1600px;width:100%;margin:0 auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.top h2{margin:0;font-size:25px}.sub{color:var(--muted);font-size:12px}.status{border-radius:20px;background:#e1f5eb;color:#176b4d;padding:7px 11px;font-size:12px;font-weight:700}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:17px;min-width:0}.metric-label{color:var(--muted);font-size:12px}.metric{font-size:24px;font-weight:800;margin-top:7px;overflow-wrap:anywhere}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:13px}.section-head h3,.card h3{margin:0;font-size:16px}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:13px}.field{display:grid;gap:5px;min-width:0}.field label{font-size:12px;color:var(--muted);font-weight:650}.field input,.field select,.field textarea,.tools input,.tools select{width:100%;min-width:0;padding:10px 11px;border:1px solid var(--line);border-radius:9px;background:white;color:var(--ink)}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.table-wrap{width:100%;overflow:auto;border:1px solid var(--line);border-radius:10px}table{width:100%;border-collapse:collapse;white-space:nowrap;background:white}th,td{padding:11px 12px;text-align:left;border-bottom:1px solid #edf1f6}th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;background:#f7f9fc;color:#607086}tbody tr:last-child td{border-bottom:0}.right{text-align:right}.muted{color:var(--muted)}.empty{padding:24px;text-align:center;color:var(--muted)}.pill{display:inline-block;border-radius:20px;padding:3px 8px;font-size:11px;background:#e9f1ff;color:#2457a7}.pill.low{background:#fff0ee;color:var(--red)}.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.inline>*{flex:1}.divider{height:1px;background:var(--line);margin:15px 0}.modal-back{position:fixed;inset:0;background:#0b1725a8;display:flex;align-items:center;justify-content:center;padding:18px;z-index:10}.modal{background:#fff;border-radius:16px;width:min(760px,100%);max-height:92vh;overflow:auto;padding:20px}.modal h3{margin:0}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.form-grid .wide{grid-column:1/-1}.toast{position:fixed;bottom:20px;right:20px;background:#14283d;color:#fff;padding:12px 16px;border-radius:10px;box-shadow:0 6px 24px #0002;z-index:20}.hidden{display:none!important}.report-total{font-weight:800}.footer-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.smalltext{font-size:12px}.warning{background:#fff8e5;border:1px solid #f3dfa5;padding:12px;border-radius:10px;color:#805b00}.sale-layout{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(300px,.9fr);gap:14px}.product-pick{display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid #edf1f6;padding:10px 0}.product-pick:last-child{border:0}.product-pick .pname{font-weight:650}.qty{width:70px!important;padding:7px!important}.print-only{display:none}
@media(max-width:1050px){.app{grid-template-columns:190px minmax(0,1fr)}main{padding:17px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.sale-layout{grid-template-columns:1fr}}@media(max-width:700px){.app{display:block}aside{padding:12px;gap:10px}.brand{padding:4px 7px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;padding:9px}.side-note{display:none}main{padding:13px}.top h2{font-size:21px}.top{align-items:flex-start}.cards{gap:8px}.card{padding:12px}.metric{font-size:19px}.grid2,.grid3,.form-grid{grid-template-columns:1fr}.form-grid .wide{grid-column:auto}.top .status{display:none}}@media print{body{background:white}.app aside,.top,.no-print,button,.tools{display:none!important}main{padding:0;max-width:none}.card{border:0;padding:0}.table-wrap{overflow:visible;border:0}table{white-space:normal;font-size:11px}th,td{padding:6px}.print-only{display:block}.cards{grid-template-columns:repeat(4,1fr)}}
</style></head>
<body>
<div class="app"><aside><div class="brand"><h1>KHAN MOBILES</h1><p>Accessories Shop Management</p></div><nav class="nav" id="nav">
<button data-page="dashboard" class="active">▦ &nbsp; Dashboard</button><button data-page="pos">＋ &nbsp; New Sale / POS</button><button data-page="products">▤ &nbsp; Inventory / Stock</button><button data-page="purchases">↓ &nbsp; Purchases</button><button data-page="customers">♙ &nbsp; Customer Ledger</button><button data-page="vendors">♧ &nbsp; Vendor Ledger</button><button data-page="cash">⇄ &nbsp; Cash In / Out</button><button data-page="expenses">− &nbsp; Expenses</button><button data-page="reports">▥ &nbsp; Daily Reports</button><button data-page="settings">⚙ &nbsp; Settings / Backup</button></nav><div class="side-note">Offline-first · Data saved in this browser<br>Export backups regularly.</div></aside>
<main><div class="top"><div><h2 id="title">Dashboard</h2><div class="sub" id="dateLabel"></div></div><div class="status" id="status">● Offline-ready</div></div><div id="content"></div></main></div>
<div id="modalRoot"></div><div id="toast" class="toast hidden"></div>
<script>
'use strict';
const KEY='khan-mobiles-shop-manager-v2';
const today=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const num=v=>Number(v)||0, money=v=>'Rs. '+num(v).toLocaleString('en-PK',{minimumFractionDigits:0,maximumFractionDigits:2});
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fresh=()=>({products:[],sales:[],purchases:[],customers:[],vendors:[],cash:[],expenses:[],adjustments:[],settings:{shop:'Khan Mobiles',phone:'03166953534',email:'khanmobiles345@gmail.com',address:'',currency:'PKR'}});
let db=load();function load(){try{const x=JSON.parse(localStorage.getItem(KEY));return x&&typeof x==='object'?{...fresh(),...x,settings:{...fresh().settings,...(x.settings||{})}}:fresh()}catch{return fresh()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){notify('Storage full. Export a backup and free browser storage.');return false}}
function notify(s){const e=document.getElementById('toast');e.textContent=s;e.classList.remove('hidden');clearTimeout(notify.t);notify.t=setTimeout(()=>e.classList.add('hidden'),3000)}
const sum=(arr,fn)=>arr.reduce((a,x)=>a+num(fn(x)),0);
function totalToday(arr){return arr.filter(x=>x.date===today())}
function page(p){location.hash=p;render()}
window.addEventListener('hashchange',render);document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)page(b.dataset.page)});
function render(){let p=location.hash.slice(1)||'dashboard';const names={dashboard:'Dashboard',pos:'New Sale / POS',products:'Inventory / Stock',purchases:'Purchases',customers:'Customer Ledger',vendors:'Vendor Ledger',cash:'Cash In / Out',expenses:'Expenses',reports:'Daily Reports',settings:'Settings & Backup'};if(!names[p])p='dashboard';document.getElementById('title').textContent=names[p];document.getElementById('dateLabel').textContent=new Date().toLocaleDateString('en-PK',{weekday:'long',year:'numeric',month:'long',day:'numeric'});document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));({dashboard, pos, products, purchases, customers, vendors, cash, expenses, reports, settings}[p])()}
function shell(html){document.getElementById('content').innerHTML=html}
function metric(label,value,sub=''){return '<div class="card"><div class="metric-label">'+label+'</div><div class="metric">'+money(value)+'</div>'+(sub?'<div class="sub">'+sub+'</div>':'')+'</div>'}
function dashboard(){const s=totalToday(db.sales),p=totalToday(db.purchases),c=totalToday(db.cash),e=totalToday(db.expenses);const sales=sum(s,x=>x.total),cost=sum(s,x=>x.cost),cashIn=sum(c.filter(x=>x.type==='in'),x=>x.amount),cashOut=sum(c.filter(x=>x.type==='out'),x=>x.amount)+sum(e,x=>x.amount);const stock=sum(db.products,x=>x.stock*x.cost),recv=sum(db.customers,x=>Math.max(0,x.balance)),pay=sum(db.vendors,x=>Math.max(0,x.balance));shell('<div class="cards">'+metric("Today’s Sales",sales,s.length+' invoices')+metric("Today’s Purchases",sum(p,x=>x.total),p.length+' records')+metric('Cash In',cashIn)+metric('Cash Out',cashOut)+metric('Stock at Cost',stock,db.products.length+' products')+metric('Customer Receivables',recv)+metric('Vendor Payables',pay)+metric('Today’s Gross Profit',sales-cost)+'</div><div class="grid2"><section class="card"><div class="section-head"><h3>Low Stock Alerts</h3><button class="small" onclick="page(\'products\')">View stock</button></div>'+lowStockHtml()+'</section><section class="card"><div class="section-head"><h3>Quick Actions</h3></div><div class="tools"><button class="primary" onclick="page(\'pos\')">＋ New Sale</button><button onclick="openProduct()">＋ Product</button><button onclick="openCash(\'in\')">＋ Cash In</button><button onclick="openCash(\'out\')">＋ Cash Out</button><button onclick="openExpense()">＋ Expense</button></div><p class="muted smalltext">Keep a daily backup using Settings & Backup. Browser data does not automatically sync to other devices.</p></section></div><div class="card" style="margin-top:14px"><div class="section-head"><h3>Recent Sales</h3><button class="small" onclick="page(\'reports\')">Open reports</button></div>'+salesTable(db.sales.slice(-8).reverse())+'</div>')}
function lowStockHtml(){const a=db.products.filter(p=>num(p.stock)<=num(p.min));return a.length?'<div class="table-wrap"><table><thead><tr><th>Product</th><th>Stock</th><th>Minimum</th></tr></thead><tbody>'+a.map(p=>'<tr><td>'+esc(p.name)+'</td><td><span class="pill low">'+num(p.stock)+'</span></td><td>'+num(p.min)+'</td></tr>').join('')+'</tbody></table></div>':'<div class="empty">All products are above minimum stock.</div>'}
function salesTable(a){return a.length?'<div class="table-wrap"><table><thead><tr><th>Date</th><th>Invoice</th><th>Customer</th><th>Payment</th><th class="right">Total</th><th class="no-print">Actions</th></tr></thead><tbody>'+a.map(s=>'<tr><td>'+esc(s.date)+'</td><td>'+esc(s.invoice)+'</td><td>'+esc(s.customerName||'Walk-in')+'</td><td>'+esc(s.payment)+'</td><td class="right">'+money(s.total)+'</td><td class="no-print"><button class="small" onclick="printSale(\''+s.id+'\')">Print</button> <button class="small" onclick="shareSale(\''+s.id+'\')">WhatsApp</button></td></tr>').join('')+'</tbody></table></div>':'<div class="empty">No sales recorded yet.</div>'}
function products(){shell('<section class="card"><div class="section-head"><h3>Product Inventory</h3><div class="inline" style="flex:0 0 auto"><button class="primary" onclick="openProduct()">＋ Add Product</button><button onclick="print()">Print</button></div></div><div class="tools"><input id="productSearch" placeholder="Search name, SKU or barcode" oninput="drawProducts()" style="max-width:330px"><button onclick="exportProducts()">Export CSV</button></div><div id="productTable"></div></section>');drawProducts()}
function drawProducts(){const q=(document.getElementById('productSearch')?.value||'').toLowerCase();const a=db.products.filter(p=>(p.name+' '+p.sku+' '+p.barcode+' '+p.category).toLowerCase().includes(q));document.getElementById('productTable').innerHTML=a.length?'<div class="table-wrap"><table><thead><tr><th>Product</th><th>Category</th><th>SKU / Barcode</th><th>Cost</th><th>Retail</th><th>Qty</th><th>Stock Value</th><th>Actions</th></tr></thead><tbody>'+a.map(p=>'<tr><td>'+esc(p.name)+'</td><td>'+esc(p.category||'—')+'</td><td>'+esc(p.sku||'—')+' / '+esc(p.barcode||'—')+'</td><td>'+money(p.cost)+'</td><td>'+money(p.price)+'</td><td><span class="pill '+(num(p.stock)<=num(p.min)?'low':'')+'">'+num(p.stock)+'</span></td><td>'+money(num(p.stock)*num(p.cost))+'</td><td><button class="small" onclick="openProduct(\''+p.id+'\')">Edit</button> <button class="small" onclick="adjustStock(\''+p.id+'\')">Adjust</button></td></tr>').join('')+'</tbody></table></div>':'<div class="empty">No products yet. Add your first product.</div>'}
function modal(title,html){document.getElementById('modalRoot').innerHTML='<div class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><h3>'+title+'</h3><button onclick="closeModal()">✕</button></div>'+html+'</div></div>'}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function field(label,name,value='',type='text',extra=''){return '<div class="field"><label>'+label+'</label><input name="'+name+'" type="'+type+'" value="'+esc(value)+'" '+extra+'></div>'}
function openProduct(pid){const p=db.products.find(x=>x.id===pid)||{name:'',category:'',sku:'',barcode:'',cost:0,price:0,stock:0,min:2,unit:'pcs'};modal(pid?'Edit Product':'Add Product','<form onsubmit="saveProduct(event,\''+(pid||'')+'\')"><div class="form-grid">'+field('Product name *','name',p.name,'text','required')+field('Category','category',p.category)+field('SKU','sku',p.sku)+field('Barcode','barcode',p.barcode)+field('Purchase cost (Rs.) *','cost',p.cost,'number','min="0" step="0.01" required')+field('Retail price (Rs.) *','price',p.price,'number','min="0" step="0.01" required')+field('Current stock quantity','stock',p.stock,'number','min="0" step="1" required')+field('Low stock alert at','min',p.min,'number','min="0" step="1" required')+field('Unit','unit',p.unit||'pcs')+'</div><div class="footer-actions"><button class="primary">Save Product</button><button type="button" onclick="closeModal()">Cancel</button></div></form>')}
function saveProduct(e,pid){e.preventDefault();const v=Object.fromEntries(new FormData(e.target));for(const k of ['cost','price','stock','min'])v[k]=num(v[k]);if(v.price<v.cost&&!confirm('Retail price is below purchase cost. Save anyway?'))return; if(pid){const p=db.products.find(x=>x.id===pid);if(v.stock!==num(p.stock)){db.adjustments.push({id:id(),date:today(),productId:pid,productName:v.name,delta:v.stock-num(p.stock),note:'Manual edit'});}Object.assign(p,v)}else db.products.push({id:id(),...v});save();closeModal();notify('Product saved');render()}
function adjustStock(pid){const p=db.products.find(x=>x.id===pid);modal('Stock Adjustment','<form onsubmit="saveAdjustment(event,\''+pid+'\')"><p>'+esc(p.name)+' · Current stock: <b>'+num(p.stock)+'</b></p><div class="form-grid">'+field('Change quantity (+ or −)','delta','0','number','step="1" required')+field('Reason','note','','text','required')+'</div><div class="footer-actions"><button class="primary">Save Adjustment</button></div></form>')}
function saveAdjustment(e,pid){e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),p=db.products.find(x=>x.id===pid),d=Math.trunc(num(f.delta));if(num(p.stock)+d<0)return notify('Stock cannot be negative.');p.stock=num(p.stock)+d;db.adjustments.push({id:id(),date:today(),productId:pid,productName:p.name,delta:d,note:f.note});save();closeModal();notify('Stock adjusted');render()}
function pos(){shell('<div class="sale-layout"><section class="card"><div class="section-head"><h3>Choose Products</h3></div><div class="tools"><input id="posSearch" placeholder="Search product / SKU / barcode" oninput="drawPosProducts()"></div><div id="posProducts"></div></section><section class="card"><div class="section-head"><h3>Sale Cart</h3><button class="small" onclick="cart=[];drawCart()">Clear</button></div><div id="cartRows"></div><div class="divider"></div><div class="form-grid">'+field('Customer name','customerName','Walk-in Customer')+field('Customer phone / WhatsApp','customerPhone')+'<div class="field"><label>Payment method</label><select id="salePayment"><option>Cash</option><option>Bank</option><option>JazzCash</option><option>Easypaisa</option><option>Card</option><option>Credit</option></select></div>'+field('Discount (Rs.)','discount','0','number','min="0" step="0.01" id="saleDiscount" oninput="drawCart()"')+'</div><div class="divider"></div><div class="inline"><span class="muted">Grand Total</span><strong id="cartTotal" style="font-size:23px">Rs. 0</strong></div><div class="footer-actions"><button class="primary" onclick="completeSale()">Complete Sale & Print</button><button onclick="completeSale(false)">Save Sale</button><button onclick="shareDraft()">WhatsApp Draft</button></div><p class="sub">Stock is checked before saving. Credit sales are added to customer receivables.</p></section></div>');window.cart=[];drawPosProducts();drawCart()}
function drawPosProducts(){const q=(document.getElementById('posSearch')?.value||'').toLowerCase();const a=db.products.filter(p=>(p.name+' '+p.sku+' '+p.barcode).toLowerCase().includes(q)&&num(p.stock)>0).slice(0,80);document.getElementById('posProducts').innerHTML=a.length?a.map(p=>'<div class="product-pick"><div><div class="pname">'+esc(p.name)+'</div><div class="sub">Stock '+num(p.stock)+' · '+money(p.price)+'</div></div><button class="small primary" onclick="addToCart(\''+p.id+'\')">Add</button></div>').join(''):'<div class="empty">No available products found.</div>'}
function addToCart(pid){const p=db.products.find(x=>x.id===pid),i=window.cart.find(x=>x.pid===pid);if(!p)return;if(i){if(i.qty>=num(p.stock))return notify('Not enough stock.');i.qty++}else window.cart.push({pid,qty:1});drawCart()}
function drawCart(){const root=document.getElementById('cartRows');if(!root)return;root.innerHTML=window.cart.length?window.cart.map(i=>{const p=db.products.find(x=>x.id===i.pid);return '<div class="product-pick"><div style="min-width:0"><div class="pname">'+esc(p?.name||'Deleted product')+'</div><div class="sub">'+money(p?.price)+' each</div></div><input class="qty" type="number" min="1" max="'+num(p?.stock)+'" value="'+i.qty+'" onchange="setQty(\''+i.pid+'\',this.value)"><strong>'+money(num(p?.price)*i.qty)+'</strong><button class="small danger" onclick="removeCart(\''+i.pid+'\')">×</button></div>'}).join(''):'<div class="empty">Cart is empty. Add products to start a sale.</div>';const subtotal=window.cart.reduce((a,i)=>a+num(db.products.find(p=>p.id===i.pid)?.price)*i.qty,0),discount=Math.max(0,num(document.getElementById('saleDiscount')?.value));document.getElementById('cartTotal').textContent=money(Math.max(0,subtotal-discount))}
function setQty(pid,v){const i=window.cart.find(x=>x.pid===pid),p=db.products.find(x=>x.id===pid);if(!i||!p)return;const q=Math.floor(num(v));if(q<1){removeCart(pid);return}if(q>num(p.stock)){notify('Quantity exceeds available stock');i.qty=num(p.stock)}else i.qty=q;drawCart()}
function removeCart(pid){window.cart=window.cart.filter(x=>x.pid!==pid);drawCart()}
function completeSale(doPrint=true){if(!window.cart.length)return notify('Cart is empty.');for(const i of window.cart){const p=db.products.find(x=>x.id===i.pid);if(!p||i.qty>num(p.stock))return notify('Stock changed; check '+(p?.name||'product'))}const subtotal=sum(window.cart,i=>num(db.products.find(p=>p.id===i.pid).price)*i.qty),discount=Math.max(0,num(document.getElementById('saleDiscount')?.value));if(discount>subtotal)return notify('Discount cannot exceed subtotal.');const customerName=document.querySelector('[name=customerName]')?.value.trim()||'Walk-in Customer',customerPhone=document.querySelector('[name=customerPhone]')?.value.trim()||'',payment=document.getElementById('salePayment').value,total=subtotal-discount;const sale={id:id(),invoice:'KM-'+Date.now().toString().slice(-8),date:today(),time:new Date().toLocaleTimeString('en-PK'),customerName,customerPhone,payment,subtotal,discount,total,cost:sum(window.cart,i=>num(db.products.find(p=>p.id===i.pid).cost)*i.qty),items:window.cart.map(i=>{const p=db.products.find(p=>p.id===i.pid);return {productId:p.id,name:p.name,qty:i.qty,price:num(p.price),cost:num(p.cost)}})};for(const i of window.cart)db.products.find(p=>p.id===i.pid).stock-=i.qty;db.sales.push(sale);if(payment==='Credit'){const c=getPerson('customers',customerName,customerPhone);c.balance=num(c.balance)+total;c.updated=today()}else db.cash.push({id:id(),date:today(),type:'in',category:'Sale',amount:total,reference:sale.invoice,method:payment});save();window.lastSale=sale;window.cart=[];notify('Sale saved: '+sale.invoice);render();if(doPrint)printSale(sale.id)}
function getPerson(kind,name,phone=''){let p=db[kind].find(x=>x.name.toLowerCase()===name.toLowerCase());if(!p){p={id:id(),name,phone,balance:0,created:today()};db[kind].push(p)}else if(phone&&!p.phone)p.phone=phone;return p}
function purchases(){shell('<section class="card"><div class="section-head"><h3>Purchase & Stock Receiving</h3><button class="primary" onclick="openPurchase()">＋ Record Purchase</button></div><p class="sub">Recording a purchase increases stock and updates vendor payable or cash out.</p><div id="purchaseTable"></div></section>');const a=db.purchases.slice().reverse();document.getElementById('purchaseTable').innerHTML=a.length?'<div class="table-wrap"><table><thead><tr><th>Date</th><th>Reference</th><th>Vendor</th><th>Product</th><th>Qty</th><th>Unit Cost</th><th>Total</th><th>Payment</th></tr></thead><tbody>'+a.map(x=>'<tr><td>'+x.date+'</td><td>'+esc(x.invoice)+'</td><td>'+esc(x.vendorName)+'</td><td>'+esc(x.productName)+'</td><td>'+x.qty+'</td><td>'+money(x.unitCost)+'</td><td>'+money(x.total)+'</td><td>'+esc(x.payment)+'</td></tr>').join('')+'</tbody></table></div>':'<div class="empty">No purchases recorded yet.</div>'}
function openPurchase(){if(!db.products.length)return notify('Add products to inventory before recording a purchase.');modal('Record Purchase','<form onsubmit="savePurchase(event)"><div class="form-grid">'+field('Vendor name *','vendorName','','text','required')+field('Vendor phone','vendorPhone')+'<div class="field wide"><label>Product *</label><select name="productId" required>'+db.products.map(p=>'<option value="'+p.id+'">'+esc(p.name)+' (stock '+p.stock+')</option>').join('')+'</select></div>'+field('Quantity *','qty','1','number','min="1" step="1" required')+field('Unit purchase cost (Rs.) *','unitCost','','number','min="0" step="0.01" required')+'<div class="field"><label>Payment status</label><select name="payment"><option>Cash</option><option>Bank</option><option>Credit</option><option>Partial</option></select></div>'+field('Amount paid (for Partial)','paid','0','number','min="0" step="0.01')+'</div><div class="footer-actions"><button class="primary">Save Purchase & Update Stock</button></div></form>')}
function savePurchase(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),p=db.products.find(x=>x.id===f.productId),qty=Math.floor(num(f.qty)),unitCost=num(f.unitCost),total=qty*unitCost;if(!p||qty<1||unitCost<0)return notify('Please check purchase details.');const vendor=getPerson('vendors',f.vendorName.trim(),f.vendorPhone.trim());p.stock=num(p.stock)+qty;p.cost=unitCost;const payment=f.payment,paid=payment==='Cash'||payment==='Bank'?total:Math.min(total,num(f.paid));const x={id:id(),invoice:'PUR-'+Date.now().toString().slice(-8),date:today(),vendorId:vendor.id,vendorName:vendor.name,productId:p.id,productName:p.name,qty,unitCost,total,payment,paid};db.purchases.push(x);if(paid>0)db.cash.push({id:id(),date:today(),type:'out',category:'Purchase',amount:paid,reference:x.invoice,method:payment});vendor.balance=num(vendor.balance)+(total-paid);save();closeModal();notify('Purchase saved and stock updated');render()}
function people(kind){const a=db[kind],customer=kind==='customers';shell('<section class="card"><div class="section-head"><h3>'+(customer?'Customer':'Vendor')+' Accounts</h3><button class="primary" onclick="openPerson(\''+kind+'\')">＋ Add '+(customer?'Customer':'Vendor')+'</button></div><div class="tools"><input id="peopleSearch" placeholder="Search name or phone" oninput="drawPeople(\''+kind+'\')" style="max-width:320px"></div><div id="peopleTable"></div></section>');drawPeople(kind)}
function customers(){people('customers')}function vendors(){people('vendors')}
function drawPeople(kind){const q=(document.getElementById('peopleSearch')?.value||'').toLowerCase(),a=db[kind].filter(p=>(p.name+' '+(p.phone||'')).toLowerCase().includes(q));document.getElementById('peopleTable').innerHTML=a.length?'<div class="table-wrap"><table><thead><tr><th>Name</th><th>Phone</th><th>Opening Balance</th><th>Current Balance</th><th>Ledger</th><th>Actions</th></tr></thead><tbody>'+a.map(p=>'<tr><td>'+esc(p.name)+'</td><td>'+esc(p.phone||'—')+'</td><td>'+money(p.openingBalance||0)+'</td><td>'+money(p.balance)+'</td><td><button class="small" onclick="personLedger(\''+kind+'\',\''+p.id+'\')">View ledger</button></td><td><button class="small" onclick="openPerson(\''+kind+'\',\''+p.id+'\')">Edit</button> <button class="small" onclick="receivePayment(\''+kind+'\',\''+p.id+'\')">Payment</button></td></tr>').join('')+'</tbody></table></div>':'<div class="empty">No records found.</div>'}
function openPerson(kind,pid){const p=db[kind].find(x=>x.id===pid)||{name:'',phone:'',balance:0};modal('Add '+(kind==='customers'?'Customer':'Vendor'),'<form onsubmit="savePerson(event,\''+kind+'\',\''+(pid||'')+'\')"><div class="form-grid">'+field('Full name *','name',p.name,'text','required')+field('Phone / WhatsApp','phone',p.phone||'')+field('Opening balance (Rs.)','openingBalance',p.openingBalance??p.balance??0,'number','step="0.01" min="0"')+'</div><div class="footer-actions"><button class="primary">Save Account</button></div></form>')}
function savePerson(e,k,pid){e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),name=f.name.trim();if(!name)return;const opening=Math.max(0,num(f.openingBalance));if(pid){const p=db[k].find(x=>x.id===pid);p.name=name;p.phone=f.phone;p.openingBalance=opening}else{db[k].push({id:id(),name,phone:f.phone,openingBalance:opening,balance:opening,created:today()})}save();closeModal();notify('Account saved');render()}
function personLedger(kind,pid){const p=db[kind].find(x=>x.id===pid);if(!p)return;const customer=kind==='customers';let rows=[];if(customer){db.sales.filter(s=>s.customerName.toLowerCase()===p.name.toLowerCase()&&s.payment==='Credit').forEach(s=>rows.push({date:s.date,ref:s.invoice,detail:'Credit sale',debit:s.total,credit:0}));db.cash.filter(c=>c.type==='in'&&c.customerId===pid).forEach(c=>rows.push({date:c.date,ref:c.reference||'',detail:c.category||'Payment received',debit:0,credit:c.amount}))}else{db.purchases.filter(x=>x.vendorId===pid).forEach(x=>rows.push({date:x.date,ref:x.invoice,detail:'Purchase',debit:x.total,credit:x.paid||0}));db.cash.filter(c=>c.type==='out'&&c.vendorId===pid).forEach(c=>rows.push({date:c.date,ref:c.reference||'',detail:c.category||'Payment made',debit:0,credit:c.amount}))}rows.sort((a,b)=>a.date.localeCompare(b.date));modal(esc(p.name)+' — Ledger','<div class="inline"><div class="card"><div class="metric-label">Current Balance</div><div class="metric">'+money(p.balance)+'</div></div><button onclick="print()">Print Ledger</button></div><div class="table-wrap" style="margin-top:12px"><table><thead><tr><th>Date</th><th>Reference</th><th>Description</th><th>Debit</th><th>Credit / Paid</th></tr></thead><tbody>'+(rows.map(r=>'<tr><td>'+r.date+'</td><td>'+esc(r.ref)+'</td><td>'+esc(r.detail)+'</td><td>'+money(r.debit)+'</td><td>'+money(r.credit)+'</td></tr>').join('')||'<tr><td colspan="5" class="empty">No transactions recorded.</td></tr>')+'</tbody></table></div><div class="footer-actions"><button class="primary" onclick="receivePayment(\''+kind+'\',\''+pid+'\')">Record Payment</button></div>')}
function receivePayment(kind,pid){const p=db[kind].find(x=>x.id===pid);if(!p)return;modal(kind==='customers'?'Receive Customer Payment':'Pay Vendor','<form onsubmit="savePersonPayment(event,\''+kind+'\',\''+pid+'\')"><p>Account: <b>'+esc(p.name)+'</b> · Balance: <b>'+money(p.balance)+'</b></p><div class="form-grid">'+field('Amount (Rs.) *','amount','','number','min="0.01" step="0.01" required')+field('Date','date',today(),'date','required')+'<div class="field"><label>Method</label><select name="method"><option>Cash</option><option>Bank</option><option>JazzCash</option><option>Easypaisa</option><option>Card</option></select></div>'+field('Note / Reference','note')+'</div><div class="footer-actions"><button class="primary">Save Payment</button></div></form>')}
function savePersonPayment(e,k,pid){e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),amt=num(f.amount),p=db[k].find(x=>x.id===pid);if(amt<=0)return notify('Enter a valid amount.');p.balance=num(p.balance)+(k==='customers'?-amt: -amt);if(p.balance<0)p.balance=0;const type=k==='customers'?'in':'out';db.cash.push({id:id(),date:f.date||today(),type,category:k==='customers'?'Customer Payment':'Vendor Payment',amount:amt,reference:f.note||p.name,method:f.method,customerId:k==='customers'?pid:undefined,vendorId:k==='vendors'?pid:undefined});save();closeModal();notify('Payment saved');render()}
function cash(){shell('<section class="card"><div class="section-head"><h3>Cash Book</h3><div class="inline" style="flex:0 0 auto"><button class="primary" onclick="openCash(\'in\')">＋ Cash In</button><button onclick="openCash(\'out\')">− Cash Out</button></div></div><div class="cards">'+metric('Total Cash In',sum(db.cash.filter(x=>x.type==='in'),x=>x.amount))+metric('Total Cash Out',sum(db.cash.filter(x=>x.type==='out'),x=>x.amount)+sum(db.expenses,x=>x.amount))+metric('Net Cash Movement',sum(db.cash.filter(x=>x.type==='in'),x=>x.amount)-sum(db.cash.filter(x=>x.type==='out'),x=>x.amount)-sum(db.expenses,x=>x.amount))+metric('Today Cash In',sum(totalToday(db.cash.filter(x=>x.type==='in')),x=>x.amount))+'</div><div class="tools"><button onclick="print()">Print Cash Book</button><button onclick="exportCash()">Export CSV</button></div><div class="table-wrap"><table><thead><tr><th>Date</th><th>Type</th><th>Category</th><th>Method</th><th>Reference</th><th class="right">Amount</th></tr></thead><tbody>'+(db.cash.slice().reverse().map(x=>'<tr><td>'+x.date+'</td><td><span class="pill">'+x.type.toUpperCase()+'</span></td><td>'+esc(x.category)+'</td><td>'+esc(x.method||'—')+'</td><td>'+esc(x.reference||'—')+'</td><td class="right">'+money(x.amount)+'</td></tr>').join('')||'<tr><td colspan="6" class="empty">No cash transactions yet.</td></tr>')+'</tbody></table></div></section>')}
function openCash(type){modal(type==='in'?'Record Cash In':'Record Cash Out','<form onsubmit="saveCash(event,\''+type+'\')"><div class="form-grid">'+field('Category / description *','category','','text','required')+field('Amount (Rs.) *','amount','','number','min="0.01" step="0.01" required')+field('Date','date',today(),'date','required')+'<div class="field"><label>Method</label><select name="method"><option>Cash</option><option>Bank</option><option>JazzCash</option><option>Easypaisa</option><option>Card</option></select></div>'+field('Reference / note','reference')+'</div><div class="footer-actions"><button class="primary">Save Transaction</button></div></form>')}
function saveCash(e,type){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));if(num(f.amount)<=0)return notify('Amount must be greater than zero.');db.cash.push({id:id(),type,date:f.date||today(),category:f.category,amount:num(f.amount),method:f.method,reference:f.reference});save();closeModal();notify('Cash transaction saved');render()}
function expenses(){shell('<section class="card"><div class="section-head"><h3>Shop Expenses</h3><button class="primary" onclick="openExpense()">＋ Add Expense</button></div><p class="sub">Rent, electricity, salaries, transport, packing and other daily costs.</p><div class="cards">'+metric('Total Expenses',sum(db.expenses,x=>x.amount))+metric('Today Expenses',sum(totalToday(db.expenses),x=>x.amount))+'</div><div class="tools"><button onclick="print()">Print</button><button onclick="exportExpenses()">Export CSV</button></div><div class="table-wrap"><table><thead><tr><th>Date</th><th>Category</th><th>Note</th><th>Method</th><th class="right">Amount</th></tr></thead><tbody>'+(db.expenses.slice().reverse().map(x=>'<tr><td>'+x.date+'</td><td>'+esc(x.category)+'</td><td>'+esc(x.note||'—')+'</td><td>'+esc(x.method||'Cash')+'</td><td class="right">'+money(x.amount)+'</td></tr>').join('')||'<tr><td colspan="5" class="empty">No expenses recorded.</td></tr>')+'</tbody></table></div></section>')}
function openExpense(){modal('Record Expense','<form onsubmit="saveExpense(event)"><div class="form-grid">'+field('Category *','category','','text','required')+field('Amount (Rs.) *','amount','','number','min="0.01" step="0.01" required')+field('Date','date',today(),'date','required')+'<div class="field"><label>Payment method</label><select name="method"><option>Cash</option><option>Bank</option><option>JazzCash</option><option>Easypaisa</option><option>Card</option></select></div><div class="field wide"><label>Note</label><input name="note" placeholder="Optional details"></div></div><div class="footer-actions"><button class="primary">Save Expense</button></div></form>')}
function saveExpense(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));if(num(f.amount)<=0)return notify('Amount must be greater than zero.');db.expenses.push({id:id(),date:f.date||today(),category:f.category,amount:num(f.amount),method:f.method,note:f.note});save();closeModal();notify('Expense saved');render()}
function reports(){const ds=document.getElementById('reportDate')?.value||today(),s=db.sales.filter(x=>x.date===ds),p=db.purchases.filter(x=>x.date===ds),c=db.cash.filter(x=>x.date===ds),e=db.expenses.filter(x=>x.date===ds),sales=sum(s,x=>x.total),cost=sum(s,x=>x.cost),cashIn=sum(c.filter(x=>x.type==='in'),x=>x.amount),cashOut=sum(c.filter(x=>x.type==='out'),x=>x.amount)+sum(e,x=>x.amount);shell('<section class="card"><div class="section-head"><h3>Daily Management Report</h3><div class="inline" style="flex:0 0 auto"><input type="date" id="reportDate" value="'+ds+'" onchange="reports()" style="padding:9px;border:1px solid var(--line);border-radius:8px"><button onclick="print()">Print Report</button></div></div><div class="cards">'+metric('Sales',sales,s.length+' invoices')+metric('Purchases',sum(p,x=>x.total),p.length+' records')+metric('Cash In',cashIn)+metric('Cash Out',cashOut)+metric('Cost of Goods Sold',cost)+metric('Gross Profit',sales-cost)+metric('Expenses',sum(e,x=>x.amount))+metric('Profit After Expenses',sales-cost-sum(e,x=>x.amount))+'</div><div class="grid2"><div class="card"><h3>Sales Details</h3>'+salesTable(s)+'</div><div class="card"><h3>Cash Summary</h3><p>Cash received: <b>'+money(cashIn)+'</b></p><p>Cash paid out: <b>'+money(cashOut)+'</b></p><p>Net movement: <b>'+money(cashIn-cashOut)+'</b></p><div class="divider"></div><p>Stock units: <b>'+sum(db.products,x=>x.stock)+'</b></p><p>Stock at cost: <b>'+money(sum(db.products,x=>num(x.stock)*num(x.cost)))+'</b></p><p>Customer balances: <b>'+money(sum(db.customers,x=>Math.max(0,x.balance)))+'</b></p><p>Vendor balances: <b>'+money(sum(db.vendors,x=>Math.max(0,x.balance)))+'</b></p></div></div><div class="card" style="margin-top:14px"><div class="section-head"><h3>Historical Daily Summary</h3><button onclick="exportDaily()">Export CSV</button></div>'+dailySummaryTable()+'</div><div class="footer-actions no-print"><button onclick="exportAllTransactions()">Export All Transactions CSV</button><button onclick="backup()">Download Full Backup</button></div></section>')}
function dailySummaryTable(){const dates=[...new Set([...db.sales,...db.purchases,...db.expenses,...db.cash].map(x=>x.date))].sort().reverse();return dates.length?'<div class="table-wrap"><table><thead><tr><th>Date</th><th>Sales</th><th>Purchases</th><th>Cash In</th><th>Cash Out + Expenses</th><th>Gross Profit</th></tr></thead><tbody>'+dates.map(d=>{const s=db.sales.filter(x=>x.date===d),p=db.purchases.filter(x=>x.date===d),c=db.cash.filter(x=>x.date===d),e=db.expenses.filter(x=>x.date===d);return '<tr><td>'+d+'</td><td>'+money(sum(s,x=>x.total))+'</td><td>'+money(sum(p,x=>x.total))+'</td><td>'+money(sum(c.filter(x=>x.type==='in'),x=>x.amount))+'</td><td>'+money(sum(c.filter(x=>x.type==='out'),x=>x.amount)+sum(e,x=>x.amount))+'</td><td>'+money(sum(s,x=>x.total-x.cost)-sum(e,x=>x.amount))+'</td></tr>'}).join('')+'</tbody></table></div>':'<div class="empty">Daily summary will appear after transactions are recorded.</div>'}
function settings(){shell('<div class="grid2"><section class="card"><h3>Shop Details</h3><form onsubmit="saveSettings(event)"><div class="form-grid" style="margin-top:14px">'+field('Shop name','shop',db.settings.shop)+field('Phone / WhatsApp','phone',db.settings.phone)+field('Email','email',db.settings.email,'email')+'<div class="field wide"><label>Address</label><input name="address" value="'+esc(db.settings.address)+'"></div></div><div class="footer-actions"><button class="primary">Save Settings</button></div></form></section><section class="card"><h3>Backup & Restore</h3><p class="muted">All records are saved in this browser on this device. Download backups often and keep them somewhere safe.</p><div class="tools"><button class="primary" onclick="backup()">Download JSON Backup</button><label><input type="file" id="restoreFile" accept="application/json" hidden onchange="restoreBackup(event)"><button type="button" onclick="document.getElementById(\'restoreFile\').click()">Restore Backup</button></label></div><div class="divider"></div><h3>Export Data</h3><div class="tools" style="margin-top:12px"><button onclick="exportProducts()">Products CSV</button><button onclick="exportCash()">Cash CSV</button><button onclick="exportExpenses()">Expenses CSV</button><button onclick="exportAllTransactions()">All Transactions CSV</button></div><div class="warning smalltext">Important: Offline mode means data stays on this browser. Clearing browser data, changing device, or using another browser can make records unavailable unless you restore a backup. WhatsApp sharing requires internet.</div><div class="divider"></div><p class="muted smalltext">Storage status: '+(function(){try{return Math.round(new Blob([JSON.stringify(db)]).size/1024)+' KB of JSON data'}catch{return 'available'}})()+'</p><button class="danger" onclick="resetData()">Reset all shop data</button></section></div>')}
function saveSettings(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));db.settings={...db.settings,...f};save();notify('Shop settings saved');render()}
function backup(){const blob=new Blob([JSON.stringify({...db,backupVersion:2,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});downloadBlob(blob,'khan-mobiles-backup-'+today()+'.json')}
function restoreBackup(e){const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x||!Array.isArray(x.products)||!Array.isArray(x.sales))throw Error('Invalid backup');if(!confirm('Restore backup and replace the current shop data? Download a backup of current data first if needed.'))return;db={...fresh(),...x,settings:{...fresh().settings,...(x.settings||{})}};save();closeModal();notify('Backup restored');render()}catch(err){notify('Could not restore: invalid or unsupported file.')}e.target.value=''};r.readAsText(f)}
function resetData(){if(!confirm('This permanently clears all shop records in this browser. Download a backup first. Continue?'))return;if(!confirm('Final confirmation: erase products, sales, purchases and ledgers?'))return;db=fresh();save();notify('Local data reset');render()}
function printSale(sid){const s=typeof sid==='object'?sid:db.sales.find(x=>x.id===sid);if(!s)return;const body='<div style="max-width:700px;margin:0 auto;font-family:Arial,sans-serif;color:#111"><h2 style="text-align:center;margin-bottom:4px">'+esc(db.settings.shop)+'</h2><p style="text-align:center;margin:0">'+esc(db.settings.phone)+' · '+esc(db.settings.email)+'</p><p style="text-align:center">'+esc(db.settings.address)+'</p><hr><p><b>Invoice:</b> '+esc(s.invoice)+' &nbsp; <b>Date:</b> '+s.date+' '+esc(s.time)+'</p><p><b>Customer:</b> '+esc(s.customerName)+' &nbsp; <b>Payment:</b> '+esc(s.payment)+'</p><table style="width:100%;border-collapse:collapse"><thead><tr><th style="text-align:left;border-bottom:1px solid #333">Product</th><th style="border-bottom:1px solid #333">Qty</th><th style="text-align:right;border-bottom:1px solid #333">Price</th><th style="text-align:right;border-bottom:1px solid #333">Total</th></tr></thead><tbody>'+s.items.map(i=>'<tr><td style="padding:8px 0">'+esc(i.name)+'</td><td style="text-align:center">'+i.qty+'</td><td style="text-align:right">'+money(i.price)+'</td><td style="text-align:right">'+money(i.price*i.qty)+'</td></tr>').join('')+'</tbody></table><hr><p style="text-align:right">Subtotal: '+money(s.subtotal)+'</p><p style="text-align:right">Discount: '+money(s.discount)+'</p><h3 style="text-align:right">Grand Total: '+money(s.total)+'</h3><p style="text-align:center;margin-top:35px">Thank you for shopping with '+esc(db.settings.shop)+'!</p></div>';const w=window.open('','_blank','width=850,height=750');if(!w){notify('Allow pop-ups to print invoices.');return}w.document.write('<!doctype html><html><head><title>'+esc(s.invoice)+'</title><meta charset="utf-8"><style>body{padding:25px}th,td{padding:7px}@media print{body{padding:0}}</style></head><body>'+body+'</body></html>');w.document.close();w.focus();setTimeout(()=>w.print(),300)}
function shareSale(sid){const s=typeof sid==='object'?sid:db.sales.find(x=>x.id===sid);if(!s)return;const lines=['*'+db.settings.shop+'*','Invoice: '+s.invoice,'Date: '+s.date,'Customer: '+s.customerName,'',...s.items.map(i=>i.name+' x '+i.qty+' = '+money(i.price*i.qty)),'','Discount: '+money(s.discount),'*Total: '+money(s.total)+'*','Payment: '+s.payment,'Thank you!'];const phone=(s.customerPhone||'').replace(/\D/g,'');const url='https://wa.me/'+(phone?phone:'')+'?text='+encodeURIComponent(lines.join('\n'));window.open(url,'_blank','noopener')}
function shareDraft(){notify('Save the sale first to create a WhatsApp invoice.')}
function csv(rows){return rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n')}
function downloadBlob(blob,name){const a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function exportRows(rows,name){downloadBlob(new Blob(['\ufeff'+csv(rows)],{type:'text/csv;charset=utf-8'}),name)}
function exportProducts(){exportRows([['Name','Category','SKU','Barcode','Cost','Retail Price','Stock','Minimum','Stock Value'],...db.products.map(p=>[p.name,p.category,p.sku,p.barcode,p.cost,p.price,p.stock,p.min,num(p.stock)*num(p.cost)])],'khan-mobiles-products.csv')}
function exportCash(){exportRows([['Date','Type','Category','Method','Reference','Amount'],...db.cash.map(x=>[x.date,x.type,x.category,x.method,x.reference,x.amount])],'khan-mobiles-cashbook.csv')}
function exportExpenses(){exportRows([['Date','Category','Note','Method','Amount'],...db.expenses.map(x=>[x.date,x.category,x.note,x.method,x.amount])],'khan-mobiles-expenses.csv')}
function exportDaily(){const dates=[...new Set([...db.sales,...db.purchases,...db.cash,...db.expenses].map(x=>x.date))].sort();exportRows([['Date','Sales','Purchases','Cash In','Cash Out','Expenses','Gross Profit'],...dates.map(d=>{const s=db.sales.filter(x=>x.date===d),p=db.purchases.filter(x=>x.date===d),c=db.cash.filter(x=>x.date===d),e=db.expenses.filter(x=>x.date===d);return[d,sum(s,x=>x.total),sum(p,x=>x.total),sum(c.filter(x=>x.type==='in'),x=>x.amount),sum(c.filter(x=>x.type==='out'),x=>x.amount),sum(e,x=>x.amount),sum(s,x=>x.total-x.cost)]})],'khan-mobiles-daily-report.csv')}
function exportAllTransactions(){exportRows([['Type','Date','Reference','Party','Description','Amount'],...db.sales.map(x=>['Sale',x.date,x.invoice,x.customerName,x.items.map(i=>i.name+' x'+i.qty).join('; '),x.total]),...db.purchases.map(x=>['Purchase',x.date,x.invoice,x.vendorName,x.productName+' x'+x.qty,x.total]),...db.cash.map(x=>['Cash '+x.type,x.date,x.reference,'',x.category,x.amount]),...db.expenses.map(x=>['Expense',x.date,'','',x.category,x.amount])],'khan-mobiles-all-transactions.csv')}
window.addEventListener('online',()=>document.getElementById('status').textContent='● Online');window.addEventListener('offline',()=>document.getElementById('status').textContent='● Offline-ready');render();
</script></body></html>
